<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zappar for A-Frame: Face Tracking — Шлем / Маска</title>

    <script src="./js/aframe.min.js"></script>
    <script src="./js/zappar-aframe/zappar-aframe.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Кнопка переключения режимов */
        #mode-toggle {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #mode-toggle:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <!-- Кнопка переключения режимов -->
    <button id="mode-toggle">Режим: Шлем</button>

    <a-scene>
        <!-- Разрешения на камеру -->
        <a-entity zappar-permissions-ui id="permissions"></a-entity>
        <!-- Сообщение о неподдерживаемом браузере -->
        <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

        <!-- Камера: user-facing — фронтальная -->
        <a-camera zappar-camera="user-facing: true;"></a-camera>

        <!-- Трекер лица -->
        <a-entity zappar-face id="my-face-tracker">

            <!-- Head mask: "сажает" голову пользователя в центр модели -->
            <a-entity zappar-head-mask="face:#my-face-tracker;"></a-entity>

            <!-- Режим 1: 3D-шлем -->
            <a-entity
                id="helmet-mode"
                gltf-model="./assets/z_helmet.glb"
                position="0.3 -1 0"
                scale="1 1 1">
            </a-entity>

            <!-- Режим 2: Face mesh (текстура лица Zappar) -->
            <a-entity
                id="facemesh-mode"
                visible="false"
                geometry="primitive: face-mesh; face: #my-face-tracker"
                material="src: url(./assets/faceMeshTemplate.png); transparent: true">
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('mode-toggle');
        const helmet = document.getElementById('helmet-mode');
        const facemesh = document.getElementById('facemesh-mode');

        let currentMode = 'helmet'; // 'helmet' или 'facemesh'

        btn.addEventListener('click', () => {
            if (currentMode === 'helmet') {
                // Переключаем на маску лица
                helmet.setAttribute('visible', 'false');
                facemesh.setAttribute('visible', 'true');
                btn.textContent = 'Режим: Маска лица';
                currentMode = 'facemesh';
            } else {
                // Переключаем на шлем
                facemesh.setAttribute('visible', 'false');
                helmet.setAttribute('visible', 'true');
                btn.textContent = 'Режим: Шлем';
                currentMode = 'helmet';
            }
        });
    </script>
</body>

</html>
